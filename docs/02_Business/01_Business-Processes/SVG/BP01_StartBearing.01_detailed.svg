<path d="M 2570 24 H 2564 V 100 H 2570" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="2573" y="36" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The work is outside Bearing: no folder picker, no in-app</text>
<text x="2573" y="46.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">repair, no adoption of a folder Bearing does not</text>
<text x="2573" y="57.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">recognise as its own.</text>
<path d="M 360 640 H 354 V 851 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="652" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Every precondition is checked before anything of the</text>
<text x="363" y="662.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">user's is touched, so a launch that fails them leaves the</text>
<text x="363" y="673.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">folder exactly as it was. The template files carry the</text>
<text x="363" y="683.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Chores board and the five life areas, so no step creates</text>
<text x="363" y="694.48" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">them. Today is put in play from no day, never from a</text>
<text x="363" y="705.1" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">previous one: a launch is not a rollover. Loading is the</text>
<text x="363" y="715.72" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">one fetch of stored state in the product: every view works</text>
<text x="363" y="726.34" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">from what is loaded here.</text>
<rect x="2371" y="161" width="30.35" height="11.5" fill="#fff"/>
