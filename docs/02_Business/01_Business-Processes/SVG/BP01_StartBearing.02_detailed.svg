<path d="M 870 24 H 864 V 100 H 870" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="873" y="36" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The work is outside Bearing: no folder picker, no in-app</text>
<text x="873" y="46.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">repair, no adoption of a folder Bearing does not</text>
<text x="873" y="57.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">recognise as its own.</text>
<path d="M 360 645 H 354 V 856 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="657" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Every precondition is checked before anything of the</text>
<text x="363" y="667.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">user's is touched, so a launch that fails them leaves the</text>
<text x="363" y="678.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">folder exactly as it was. The template files carry the</text>
<text x="363" y="688.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Chores board and the five life areas, so no step creates</text>
<text x="363" y="699.48" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">them. Today is put in play from no day, never from a</text>
<text x="363" y="710.1" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">previous one: a launch is not a rollover. Loading is the</text>
<text x="363" y="720.72" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">one fetch of stored state in the product: every view works</text>
<text x="363" y="731.34" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">from what is loaded here.</text>
