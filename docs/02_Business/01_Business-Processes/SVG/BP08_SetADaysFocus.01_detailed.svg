<text x="1452" y="507" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Day focus answered</text>
<path d="M 360 24 H 354 V 115 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="36" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Zero to many per project. The ready ones are offered</text>
<text x="363" y="46.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">first; nothing forces one at a time. A simple project</text>
<text x="363" y="57.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">contributes its own board and has no activities to pick.</text>
<path d="M 1210 76 H 1204 V 137 H 1210" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="1213" y="88" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Chores is never picked. It joins the day on its own while it</text>
<text x="1213" y="98.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">carries work that is not done.</text>
<path d="M 870 535 H 864 V 686 H 870" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="873" y="547" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">A commit replaces the date's previous selection rather</text>
<text x="873" y="557.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">than adding to it, so the boards in play are exactly what</text>
<text x="873" y="568.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">was last committed. A routine that already owes a task</text>
<text x="873" y="578.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">gets no second one, on any date. Due and overdue are</text>
<text x="873" y="589.48" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">treated the same. Dropping a routine leaves a task</text>
<text x="873" y="600.1" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">already created where it is.</text>
