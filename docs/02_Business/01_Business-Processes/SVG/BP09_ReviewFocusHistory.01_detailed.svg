<text x="1213" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Previous, next and back-to-current are the same read</text>
<text x="1213" y="134.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">with another parameter.</text>
<path d="M 1210 24 H 1204 V 100 H 1210" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="1213" y="36" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The day focus editor opens on the selected day and the</text>
<text x="1213" y="46.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">period stays behind it. Setting the focus is BP08.</text>
<path d="M 360 953 H 354 V 1074 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="965" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">One read serves week, month and year, and serves</text>
<text x="363" y="975.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">previous, next and current alike. There is no day-scoped</text>
<text x="363" y="986.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">view. The Chores board is absent from history: a derived</text>
<text x="363" y="996.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">member cannot be reconstructed for a past date.</text>
<path d="M 1380 953 H 1374 V 1014 H 1380" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="1383" y="965" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The log holds what was completed, what was still open,</text>
<text x="1383" y="975.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">and the notes written that day.</text>
