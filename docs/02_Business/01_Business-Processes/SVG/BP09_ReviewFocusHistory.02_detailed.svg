<path d="M 700 112 H 694 V 173 H 700" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="703" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Previous, next and back-to-current are the same read</text>
<text x="703" y="134.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">with another parameter.</text>
<path d="M 700 24 H 694 V 100 H 700" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="703" y="36" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The day focus editor opens on the selected day and the</text>
<text x="703" y="46.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">period stays behind it. Setting the focus is BP08.</text>
<path d="M 360 958 H 354 V 1079 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="970" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">One read serves week, month and year, and serves</text>
<text x="363" y="980.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">previous, next and current alike. There is no day-scoped</text>
<text x="363" y="991.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">view. The Chores board is absent from history: a derived</text>
<text x="363" y="1001.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">member cannot be reconstructed for a past date.</text>
<path d="M 870 958 H 864 V 1019 H 870" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="873" y="970" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The log holds what was completed, what was still open,</text>
<text x="873" y="980.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">and the notes written that day.</text>
