<text x="92" y="476" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">At work in Bearing</text>
<rect x="254" y="404" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="304" y="440.7" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Work on whatever is</text>
