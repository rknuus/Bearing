<text x="942" y="476" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">The day rolled over</text>
<path d="M 1154 419 L 1179 444 L 1154 469 L 1129 444 Z" fill="#fff" stroke="#000" stroke-width="1"/>
<path d="M 1143.5 433.5 L 1164.5 454.5 M 1143.5 454.5 L 1164.5 433.5" stroke="#000" stroke-width="1"/>
<text x="1112" y="483" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Is the new date's</text>
<text x="1112" y="493.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">focus empty?</text>
<rect x="1274" y="404" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="1324" y="440.7" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Read the offer to set</text>
<text x="1324" y="452.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">the day's focus</text>
<path d="M 1494 419 L 1519 444 L 1494 469 L 1469 444 Z" fill="#fff" stroke="#000" stroke-width="1"/>
<path d="M 1483.5 433.5 L 1504.5 454.5 M 1483.5 454.5 L 1504.5 433.5" stroke="#000" stroke-width="1"/>
<text x="1452" y="483" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Take the offer?</text>
<rect x="1614" y="404" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="1664" y="440.7" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Open the day focus</text>
<text x="1664" y="452.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">editor</text>
<rect x="1614" y="524" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="1664" y="560.7" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Carry on with what</text>
<text x="1664" y="572.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">was open</text>
<rect x="1274" y="524" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="1324" y="560.7" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Carry on with the</text>
<text x="1324" y="572.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">new date in play</text>
<circle cx="1834" cy="444" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="1792" y="476" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">New day in play</text>
<circle cx="304" cy="864" r="18" fill="#fff" stroke="#000" stroke-width="1.1"/>
<rect x="295" y="858.06" width="18" height="11.88" fill="#fff" stroke="#000" stroke-width="0.8"/>
<path d="M 295 858.06 L 304 864 L 313 858.06" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="262" y="896" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Rollover due</text>
<rect x="424" y="824" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="474" y="860.7" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Advance which date</text>
<text x="474" y="872.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">is current</text>
<rect x="594" y="824" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="644" y="854.8" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Put the new date's</text>
<text x="644" y="866.6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">focus in play, empty</text>
<text x="644" y="878.4" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">until it is set</text>
<rect x="764" y="824" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="814" y="854.8" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Carry the previous</text>
<text x="814" y="866.6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">date's focus and log</text>
<text x="814" y="878.4" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">into history</text>
<rect x="934" y="824" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="984" y="854.8" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Report whether the</text>
<text x="984" y="866.6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">new date's focus is</text>
<text x="984" y="878.4" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">empty</text>
<circle cx="1154" cy="864" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="1112" y="896" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Rollover answered</text>
<path d="M 870 482 H 864 V 558 H 870" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="873" y="494" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The board in front of the user stays open and a gesture</text>
<text x="873" y="504.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">already under way, a drag included, is unaffected.</text>
<path d="M 1550 338 H 1544 V 384 H 1550" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="1553" y="350" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Setting the focus is its own process. The offer only opens</text>
<text x="1553" y="360.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">it.</text>
<path d="M 1550 624 H 1544 V 685 H 1550" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="1553" y="636" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The offer changes nothing by itself. Ignoring it leaves the</text>
<text x="1553" y="646.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">day unfocused.</text>
<path d="M 360 924 H 354 V 1045 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="936" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Rollover creates nothing and destroys nothing: no task is</text>
<text x="363" y="946.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">spawned, nothing is archived and nothing is closed. A</text>
<text x="363" y="957.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">date never checked out stays checkable out. Chores</text>
<text x="363" y="967.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">follows the new date on its own while it carries work that</text>
<text x="363" y="978.48" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">is not done.</text>
<rect x="1521" y="445" width="24.68" height="11.5" fill="#fff"/>
<text x="1522" y="454.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">take it</text>
<rect x="1551" y="445" width="32.23" height="11.5" fill="#fff"/>
<text x="1552" y="454.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">ignore it</text>
<rect x="1181" y="445" width="15.23" height="11.5" fill="#fff"/>
<text x="1182" y="454.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">yes</text>
<rect x="1211" y="445" width="11.45" height="11.5" fill="#fff"/>
<text x="1212" y="454.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">no</text>
<rect x="391" y="197" width="65.78" height="20.73" fill="#fff"/>
<text x="392" y="205.23" font-family="Helvetica, Arial, sans-serif" font-size="7.23" fill="#555555">BP14.01</text>
<text x="392" y="215.73" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">Roll the day over</text>
<rect x="731" y="813" width="74.75" height="11.5" fill="#fff"/>
<text x="732" y="822.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">The day rolled over</text>
