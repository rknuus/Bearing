<text x="262" y="776" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Rollover due</text>
<rect x="424" y="704" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="474" y="746.6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Update current date</text>
<rect x="594" y="704" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="644" y="734.8" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Put the new date's</text>
<text x="644" y="746.6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">focus in play, empty</text>
<text x="644" y="758.4" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">until it is set</text>
<rect x="764" y="704" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="814" y="740.7" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Report the new</text>
<text x="814" y="752.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">date's focus</text>
<circle cx="984" cy="744" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="942" y="776" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Rollover answered</text>
<path d="M 700 482 H 694 V 648 H 700" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="703" y="494" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The board in front of the user stays open and a gesture</text>
<text x="703" y="504.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">already under way, a drag included, is unaffected. That</text>
<text x="703" y="515.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">the date advanced is said quietly, and where the new</text>
<text x="703" y="525.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">date carries no focus that is said with it; nothing is</text>
<text x="703" y="536.48" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">offered and nothing is asked. Setting a focus is the user's</text>
<text x="703" y="547.1" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">own act, started on the Focus tab (BP08).</text>
<path d="M 360 804 H 354 V 970 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="816" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Rollover creates nothing and destroys nothing: no task is</text>
<text x="363" y="826.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">spawned, nothing is archived, nothing is closed and</text>
<text x="363" y="837.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">nothing is settled, and the date that just ended keeps the</text>
<text x="363" y="847.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">focus record it already had. That date joins the span the</text>
<text x="363" y="858.48" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">next check-out settles. Chores follows the new date on</text>
<text x="363" y="869.1" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">its own while it carries work that is not done.</text>
