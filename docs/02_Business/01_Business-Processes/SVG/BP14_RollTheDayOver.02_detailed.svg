<circle cx="644" cy="744" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="602" y="776" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Rollover answered</text>
<path d="M 360 496 H 354 V 662 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="508" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The board in front of the user stays open and a gesture</text>
<text x="363" y="518.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">already under way, a drag included, is unaffected. That</text>
<text x="363" y="529.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">the date advanced is said quietly, and where the new</text>
<text x="363" y="539.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">date carries no focus that is said with it; nothing is</text>
<text x="363" y="550.48" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">offered and nothing is asked. Setting a focus is the user's</text>
<text x="363" y="561.1" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">own act, started on the Focus tab (BP08).</text>
<path d="M 360 809 H 354 V 975 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="821" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Rollover creates nothing and destroys nothing: no task is</text>
<text x="363" y="831.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">spawned, nothing is archived, nothing is closed and</text>
<text x="363" y="842.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">nothing is settled, and the date that just ended keeps the</text>
<text x="363" y="852.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">focus record it already had. That date joins the span the</text>
<text x="363" y="863.48" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">next check-out settles. Chores follows the new date on</text>
<text x="363" y="874.1" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">its own while it carries work that is not done.</text>
