<circle cx="644" cy="864" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="602" y="896" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Rollover answered</text>
<path d="M 360 496 H 354 V 572 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="508" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The board in front of the user stays open and a gesture</text>
<text x="363" y="518.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">already under way, a drag included, is unaffected.</text>
<path d="M 1040 338 H 1034 V 384 H 1040" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="1043" y="350" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Setting the focus is its own process. The offer only opens</text>
<text x="1043" y="360.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">it.</text>
<path d="M 1040 624 H 1034 V 685 H 1040" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="1043" y="636" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The offer changes nothing by itself. Ignoring it leaves the</text>
<text x="1043" y="646.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">day unfocused.</text>
<path d="M 360 929 H 354 V 1050 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="941" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Rollover creates nothing and destroys nothing: no task is</text>
<text x="363" y="951.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">spawned, nothing is archived and nothing is closed. A</text>
<text x="363" y="962.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">date never checked out stays checkable out. Chores</text>
<text x="363" y="972.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">follows the new date on its own while it carries work that</text>
<text x="363" y="983.48" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">is not done.</text>
<rect x="1011" y="445" width="24.68" height="11.5" fill="#fff"/>
<text x="1012" y="454.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">take it</text>
<rect x="1041" y="445" width="32.23" height="11.5" fill="#fff"/>
<text x="1042" y="454.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">ignore it</text>
<rect x="671" y="445" width="15.23" height="11.5" fill="#fff"/>
<text x="672" y="454.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">yes</text>
<rect x="701" y="445" width="11.45" height="11.5" fill="#fff"/>
<text x="702" y="454.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">no</text>
