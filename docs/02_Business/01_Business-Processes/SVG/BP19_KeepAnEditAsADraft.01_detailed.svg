<text x="92" y="237" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">A draftable field is</text>
<text x="92" y="247.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">being filled in</text>
