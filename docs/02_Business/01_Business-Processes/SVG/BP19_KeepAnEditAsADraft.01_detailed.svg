<line x1="299.5" y1="234" x2="308.5" y2="234" stroke="#000" stroke-width="1.4"/>
<text x="304" y="207.6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Type into the field</text>
<circle cx="474" cy="205" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="432" y="237" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">The edit is safe</text>
<text x="432" y="247.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">either way</text>
<circle cx="304" cy="505" r="18" fill="#fff" stroke="#000" stroke-width="1.1"/>
<rect x="295" y="499.06" width="18" height="11.88" fill="#fff" stroke="#000" stroke-width="0.8"/>
<path d="M 295 499.06 L 304 505 L 313 499.06" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="262" y="537" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Edit submitted</text>
<rect x="424" y="465" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="474" y="501.7" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Keep what is typed</text>
<text x="474" y="513.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">as a draft</text>
<circle cx="644" cy="505" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="602" y="537" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Draft kept</text>
<path d="M 190 24 H 184 V 145 H 190" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="193" y="36" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Leaving it costs nothing: it is there on the next launch,</text>
<text x="193" y="46.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">half-finished, and it has changed nothing meanwhile.</text>
<text x="193" y="57.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Committing it is the act of whichever process the field</text>
<text x="193" y="67.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">belongs to, and that is what discards the draft.</text>
<path d="M 360 565 H 354 V 656 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="577" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">One-way: nothing waits for the draft to be kept. It stays</text>
<text x="363" y="587.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">out of the planning history, and nothing it describes takes</text>
<text x="363" y="598.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">effect until the gesture that owns it completes.</text>
<rect x="306" y="246" width="89.89" height="20.73" fill="#fff"/>
<text x="307" y="254.23" font-family="Helvetica, Arial, sans-serif" font-size="7.23" fill="#555555">BP19.01</text>
<text x="307" y="264.73" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">Keep the edit as a draft</text>
</svg>
