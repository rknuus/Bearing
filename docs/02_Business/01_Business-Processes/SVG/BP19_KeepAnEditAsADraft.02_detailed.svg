<circle cx="644" cy="505" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="602" y="537" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Draft kept</text>
<path d="M 190 24 H 184 V 145 H 190" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="193" y="36" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Leaving it costs nothing: it is there on the next launch,</text>
<text x="193" y="46.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">half-finished, and it has changed nothing meanwhile.</text>
<text x="193" y="57.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Committing it is the act of whichever process the field</text>
<text x="193" y="67.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">belongs to, and that is what discards the draft.</text>
<path d="M 360 570 H 354 V 661 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="582" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">One-way: nothing waits for the draft to be kept. It stays</text>
<text x="363" y="592.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">out of the planning history, and nothing it describes takes</text>
<text x="363" y="603.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">effect until the gesture that owns it completes.</text>
<rect x="306" y="246" width="89.89" height="20.73" fill="#fff"/>
<text x="307" y="254.23" font-family="Helvetica, Arial, sans-serif" font-size="7.23" fill="#555555">BP19.01</text>
<text x="307" y="264.73" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">Keep the edit as a draft</text>
