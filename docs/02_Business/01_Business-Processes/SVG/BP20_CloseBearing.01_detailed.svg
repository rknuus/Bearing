<text x="92" y="222" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Nothing more to do</text>
<text x="92" y="232.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">in Bearing</text>
