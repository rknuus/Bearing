<text x="474" y="486.7" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Shut the product</text>
<text x="474" y="498.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">down</text>
<circle cx="644" cy="490" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="602" y="522" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Product shut down</text>
<path d="M 190 24 H 184 V 130 H 190" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="193" y="36" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Nothing is pending: every gesture has been committed</text>
<text x="193" y="46.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">or left as a draft, and a draft is there again on the next</text>
<text x="193" y="57.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">launch. Nothing is settled either - the span since the last</text>
<text x="193" y="67.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">check-out stays open.</text>
<path d="M 360 550 H 354 V 641 H 360" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="363" y="562" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">One-way: nothing waits for the shutdown to be reported.</text>
<text x="363" y="572.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The drafts and the remembered interface state stay</text>
<text x="363" y="583.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">where they are, and the next launch restores them.</text>
