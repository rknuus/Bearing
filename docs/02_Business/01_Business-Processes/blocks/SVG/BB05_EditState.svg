<text x="193" y="628" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">A state is its own act where it has an owner or a</text>
<text x="193" y="638.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">consequence beyond the record; otherwise it is a field of</text>
<text x="193" y="649.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">the editor. Where the answer also raises a further act - a</text>
<text x="193" y="659.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">move that put an activity's last task into Done - that is the</text>
<text x="193" y="670.48" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">member's own business.</text>
