<circle cx="134" cy="144" r="18" fill="#fff" stroke="#000" stroke-width="1.1"/>
<text x="92" y="176" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">A &lt;entity&gt; needs</text>
<text x="92" y="186.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">attention</text>
<rect x="254" y="104" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="304" y="146.6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Open the &lt;view&gt;</text>
<rect x="424" y="104" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="474" y="146.6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Work a &lt;entity&gt;</text>
<path d="M 644 119 L 669 144 L 644 169 L 619 144 Z" fill="#fff" stroke="#000" stroke-width="1"/>
<path d="M 633.5 133.5 L 654.5 154.5 M 633.5 154.5 L 654.5 133.5" stroke="#000" stroke-width="1"/>
<text x="602" y="183" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">What needs doing?</text>
<rect x="764" y="104" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="814" y="146.6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Perform one act</text>
<circle cx="984" cy="144" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="942" y="176" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">&lt;What the gesture</text>
<text x="942" y="186.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">did&gt;</text>
<rect x="764" y="224" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="814" y="266.6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Perform another one</text>
<circle cx="984" cy="264" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="942" y="296" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">&lt;What that gesture</text>
<text x="942" y="306.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">did&gt;</text>
<path d="M 190 204 H 184 V 265 H 190" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="193" y="216" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Opening it is OpenView: one request, one answer, and</text>
<text x="193" y="226.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">the question decides on that answer.</text>
<path d="M 700 316 H 694 V 437 H 700" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="703" y="328" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">One branch per act, each of them a block: EditContent,</text>
<text x="703" y="338.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">EditState, ArchiveLeafItem, DeleteCascadedItem,</text>
<text x="703" y="349.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">UnarchiveItem, a hand-over to a sub-process, a seam.</text>
<text x="703" y="359.86" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">An act never asks the user to re-read the view</text>
<text x="703" y="370.48" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">afterwards.</text>
<rect x="671" y="145" width="25.15" height="11.5" fill="#fff"/>
<text x="672" y="154.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">an act</text>
<rect x="701" y="145" width="44.53" height="11.5" fill="#fff"/>
<text x="702" y="154.5" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#1a1a1a">another act</text>
</svg>
