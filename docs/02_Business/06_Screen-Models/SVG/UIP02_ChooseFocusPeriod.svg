<rect x="594" y="224" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="644" y="260.7" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Open the logs</text>
<text x="644" y="272.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">covering that day</text>
<circle cx="814" cy="264" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="772" y="296" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Logs read</text>
<rect x="594" y="344" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="644" y="380.7" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Select the day to</text>
<text x="644" y="392.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">edit (BP08)</text>
<circle cx="814" cy="384" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="772" y="416" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Day opened for</text>
<text x="772" y="426.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">editing</text>
<path d="M 190 204 H 184 V 295 H 190" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="193" y="216" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The period a view shows, how it relates to now and its</text>
<text x="193" y="226.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">theme balance are derived from the days in play; nothing</text>
<text x="193" y="237.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">is fetched for them. The smallest scope is a week.</text>
<path d="M 530 436 H 524 V 527 H 530" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="533" y="448" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">A log covers everything since the check-out before it. A</text>
<text x="533" y="458.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">day split by two check-outs is covered by both; a day</text>
<text x="533" y="469.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">nobody has settled yet is covered by none.</text>
<path d="M 530 539 H 524 V 615 H 530" fill="none" stroke="#000" stroke-width="0.8"/>
<text x="533" y="551" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">The day focus editor opens on the selected day and the</text>
<text x="533" y="561.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">period stays behind it. Committing that focus is its own</text>
<text x="533" y="572.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">process (BP08).</text>
<rect x="501" y="145" width="84.21" height="11.5" fill="#fff"/>
