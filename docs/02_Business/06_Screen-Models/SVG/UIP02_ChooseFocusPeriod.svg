<text x="92" y="176" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">A stretch of days</text>
<text x="92" y="186.62" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">worth looking back</text>
<text x="92" y="197.24" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">on</text>
<rect x="254" y="104" width="100" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1"/>
<text x="304" y="134.8" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">Choose which week,</text>
<text x="304" y="146.6" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">month or year to</text>
<text x="304" y="158.4" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">review</text>
