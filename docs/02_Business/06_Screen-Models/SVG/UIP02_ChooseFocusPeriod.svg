<text x="644" y="152.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">switch the scope</text>
<circle cx="814" cy="144" r="18" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="772" y="176" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Another period</text>
